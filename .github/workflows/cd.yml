name: CD
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
env:
  major: 0
  minor: 3
jobs:
  publish:
    name: Build and Publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup env

      - name: Set tag for non-master branches
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "master" ]; then
            # Sanitize branch name for NuGet (replace / with -)
            TAG=$(echo "$BRANCH" | sed 's/\//-/g')
            echo "tag=-$TAG" >> $GITHUB_ENV
          else
            echo "tag=" >> $GITHUB_ENV
          fi
      - name: Set version
        run: echo "APP_VERSION=${{ env.major }}.${{ env.minor }}.${{ github.run_number }}${{ env.tag }}" >> $GITHUB_ENV
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      
      # restore and build
      
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: >-
          dotnet  build 
          --configuration Release 
          --no-restore
          /p:Version=${{ env.APP_VERSION }}
      
      # test and publish coverage and reports

      - name: Test
        run: >-
          dotnet test 
          --configuration Release 
          --no-build 
          --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
      - name: Generate Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.11
        with:
          reports: './**/coverage.cobertura.xml'
          targetdir: './coverage-report'
          reporttypes: 'HtmlInline;Cobertura'
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report
      - name: Upload Coverage to Codecov (Optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./**/coverage.cobertura.xml
          fail_ci_if_error: false
      
      # pack and publish    
          
      - name: Pack
        run: >-
          dotnet pack Sigaba.Cli/Sigaba.Cli.csproj 
          --output ./artifacts
          --configuration Release 
          --no-restore 
          --no-build
          /p:PackageVersion=${{ env.APP_VERSION }}
      - name: Push to NuGet
        run: >-
          dotnet nuget push ./artifacts/*.nupkg 
          --source https://api.nuget.org/v3/index.json
          --api-key ${{steps.login.outputs.NUGET_API_KEY}}
          --skip-duplicate